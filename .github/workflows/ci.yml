name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generated API client matches the OpenAPI spec
        run: bun run check:api

      - name: Typecheck
        run: bunx tsc -b

      - name: Tests
        run: bunx vitest run
